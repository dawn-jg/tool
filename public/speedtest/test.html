<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tooltip 网速测试验证页</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; padding: 40px 20px; }
  .card { background: #1e293b; border-radius: 16px; padding: 32px; max-width: 520px; width: 100%; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  .sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .metric { background: #0f172a; border-radius: 12px; padding: 16px; text-align: center; }
  .metric .label { font-size: 12px; color: #94a3b8; }
  .metric .value { font-size: 28px; font-weight: 700; margin-top: 4px; }
  .metric .unit { font-size: 14px; color: #94a3b8; }
  .progress { height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; margin-bottom: 24px; }
  .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #22d3ee); transition: width 0.2s; }
  .status { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 16px; min-height: 20px; }
  button { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #3b82f6; color: white; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:disabled { background: #334155; cursor: not-allowed; }
</style>
</head>
<body>
<div class="card">
  <h1>⚡ 网速测试</h1>
  <p class="sub">通过 Cloudflare 全球边缘节点测速 · 由 LibreSpeed 驱动</p>
  <div class="metrics">
    <div class="metric"><div class="label">下载</div><div class="value" id="dl">--</div><div class="unit">Mbps</div></div>
    <div class="metric"><div class="label">上传</div><div class="value" id="ul">--</div><div class="unit">Mbps</div></div>
    <div class="metric"><div class="label">延迟</div><div class="value" id="ping">--</div><div class="unit">ms</div></div>
    <div class="metric"><div class="label">抖动</div><div class="value" id="jit">--</div><div class="unit">ms</div></div>
  </div>
  <div class="progress"><div class="progress-bar" id="bar"></div></div>
  <div class="status" id="status">准备就绪</div>
  <button id="start">开始测速</button>
</div>
<script src="/speedtest/speedtest.js"></script>
<script>
  const s = new Speedtest();
  const phases = { 0: '准备中', 1: '下载测试', 2: '延迟/抖动测试', 3: '上传测试', 4: '完成', 5: '已中止' };
  // 配置 Cloudflare 官方测速端点
  s.setParameter('url_dl', 'https://speed.cloudflare.com/__down?bytes=25000000');
  s.setParameter('url_ul', 'https://speed.cloudflare.com/__up');
  s.setParameter('url_ping', 'https://speed.cloudflare.com/__down?bytes=100');
  s.setParameter('telemetry_level', 0);
  s.setParameter('garbagePhp_chunkSize', 25000000);
  s.setParameter('xhr_dlMultistream', 4);
  s.setParameter('xhr_ulMultistream', 4);
  s.setParameter('time_dl_max', 12);
  s.setParameter('time_ul_max', 12);
  s.setParameter('test_order', 'D_U');
  s.onupdate = function (d) {
    document.getElementById('dl').textContent = d.dlStatus || '--';
    document.getElementById('ul').textContent = d.ulStatus || '--';
    document.getElementById('ping').textContent = d.pingStatus || '--';
    document.getElementById('jit').textContent = d.jitterStatus || '--';
    const progress = Math.max(d.dlProgress || 0, d.ulProgress || 0, d.pingProgress || 0);
    document.getElementById('bar').style.width = Math.round(progress * 100) + '%';
    document.getElementById('status').textContent = (phases[d.testState] || '') + (d.clientIp ? ' · ' + d.clientIp : '');
  };
  s.onend = function () {
    document.getElementById('status').textContent = '测试完成';
    document.getElementById('start').disabled = false;
    document.getElementById('start').textContent = '重新测试';
  };
  document.getElementById('start').addEventListener('click', function () {
    const btn = this;
    btn.disabled = true;
    btn.textContent = '测速中...';
    s.start();
  });
</script>
</body>
</html>
